<!DOCTYPE html>
<html lang="en">
<head>

    <title>Adventures — Nicholas Georgiou</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #f5f0e8;
            --ink: #1a1a1a;
            --rust: #c94a2a;
            --gold: #D4A853;
            --muted: rgba(245,240,232,0.45);
        }

        html, body {
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            background: var(--ink);
            color: var(--cream);
            font-family: 'DM Mono', monospace;
            cursor: auto;
            overflow: hidden;
        }

        a { color: inherit; }

        .cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: var(--rust);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
            mix-blend-mode: difference;
        }

        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--cream);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.25s, height 0.25s, border-color 0.2s;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(245,240,232,0.08);
            background: rgba(26,26,26,0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .monogram {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--cream);
            letter-spacing: 0.12em;
            text-decoration: none;
        }

        .monogram em {
            color: var(--rust);
            font-style: normal;
        }

        nav.main-nav {
            display: flex;
            align-items: center;
        }

        nav.main-nav a {
            position: relative;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15px;
            letter-spacing: 0.28em;
            color: var(--muted);
            text-decoration: none;
            padding: 10px 22px;
            transition: color 0.25s;
            text-transform: uppercase;
        }

        nav.main-nav a::before {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: var(--rust);
            transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        nav.main-nav a:hover,
        nav.main-nav a.active {
            color: var(--cream);
        }

        nav.main-nav a:hover::before,
        nav.main-nav a.active::before {
            width: calc(100% - 44px);
        }

        nav.main-nav a + a::after {
            content: '·';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translate(-50%, -50%);
            color: rgba(245,240,232,0.15);
            font-size: 16px;
            pointer-events: none;
        }

        #cesiumContainer {
            position: fixed;
            inset: 0;
            padding-top: 65px;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .cesium-infoBox,
        .cesium-viewer-infoBoxContainer {
            display: none !important;
        }

        .grain {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 50;
        }

        .overlay-panel {
            position: fixed;
            top: 118px;
            left: 40px;
            z-index: 120;
            max-width: 920px;
            pointer-events: none;
        }

        .hero-eyebrow {
            font-size: 10px;
            letter-spacing: 0.45em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(42px, 6vw, 86px);
            line-height: 0.92;
            letter-spacing: 0.03em;
            color: var(--cream);
            text-shadow: 0 3px 18px rgba(0,0,0,0.35);
        }

        .hero-title em {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.5em;
            color: var(--gold);
            display: block;
            letter-spacing: 0.02em;
            margin-top: 8px;
        }

        .hero-sub {
            margin-top: 18px;
            font-size: 12px;
            line-height: 1.9;
            color: rgba(245,240,232,0.72);
            max-width: 640px;
        }

        #filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
            pointer-events: auto;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(245,240,232,0.18);
            background: rgba(26,26,26,0.72);
            color: var(--cream);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: button;
            transition: all 0.2s ease;
            letter-spacing: 0.02em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .filter-btn:hover {
            border-color: rgba(212,168,83,0.5);
            background: rgba(245,240,232,0.08);
        }

        .filter-btn.active {
            border-color: rgba(212,168,83,0.7);
            background: rgba(212,168,83,0.18);
            color: var(--cream);
        }

        .filter-btn .btn-icon {
            font-size: 1rem;
            line-height: 1;
        }

        #map-controls-toggle {
            position: static;
            z-index: 180;
            padding: 8px 12px;
            border: 1px solid rgba(245,240,232,0.24);
            border-radius: 999px;
            background: rgba(20,20,20,0.78);
            color: var(--cream);
            font: 0.62rem 'DM Mono', monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #map-controls-toggle:hover { border-color: var(--gold); }
        #map-controls-toggle { pointer-events: auto; }
        body.controls-hidden .overlay-panel .hero-title,
        body.controls-hidden #filter-bar .filter-btn,
        body.controls-hidden #timeline-wrap { display: none; }

        #timeline-wrap {
            position: fixed;
            top: 110px;
            right: 28px;
            z-index: 150;
            width: min(390px, calc(100vw - 40px));
            padding: 12px 16px 10px;
            border: 1px solid rgba(245,240,232,0.16);
            border-radius: 12px;
            background: rgba(20,20,20,0.78);
            color: var(--cream);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #timeline-topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        #timeline-heading {
            color: rgba(245,240,232,0.68);
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #timeline-range-label {
            flex: 1;
            padding: 0 6px;
            color: var(--gold);
            font-size: 0.64rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            text-align: center;
            white-space: nowrap;
        }

        #timeline-control {
            position: relative;
            height: 26px;
            margin: 0 8px;
            touch-action: none;
        }

        #timeline-track,
        #timeline-selection {
            position: absolute;
            top: 11px;
            height: 4px;
            border-radius: 99px;
        }

        #timeline-track {
            left: 0;
            right: 0;
            background: rgba(245,240,232,0.2);
        }

        #timeline-selection {
            z-index: 2;
            min-width: 8px;
            background: var(--gold);
            cursor: grab;
        }

        #timeline-selection:active { cursor: grabbing; }

        .timeline-range {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 26px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            pointer-events: none;
            z-index: 3;
        }

        .timeline-range::-webkit-slider-runnable-track {
            height: 26px;
            background: transparent;
        }

        .timeline-range::-moz-range-track {
            height: 26px;
            background: transparent;
        }

        .timeline-range::-webkit-slider-thumb {
            width: 14px;
            height: 14px;
            margin-top: 6px;
            appearance: none;
            -webkit-appearance: none;
            border: 2px solid #fff;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            pointer-events: auto;
            cursor: ew-resize;
        }

        .timeline-range::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            pointer-events: auto;
            cursor: ew-resize;
        }

        #timeline-years {
            display: flex;
            justify-content: space-between;
            margin: -1px 6px 0;
            color: rgba(245,240,232,0.56);
            font-size: 0.56rem;
            font-variant-numeric: tabular-nums;
        }

        #timeline-all {
            border: 0;
            padding: 3px 5px;
            background: transparent;
            color: rgba(245,240,232,0.7);
            font: 0.58rem 'DM Mono', monospace;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        #timeline-all:hover { color: #fff; }

        @media (max-width: 700px) {
            #timeline-wrap {
                top: auto;
                left: 50%;
                right: auto;
                bottom: max(30px, env(safe-area-inset-bottom));
                transform: translateX(-50%);
                width: min(300px, calc(100vw - 32px));
                max-width: 300px;
                margin-inline: 0;
                padding: 4px 8px 3px;
                border-radius: 8px 8px 0 0;
                background: rgba(20,20,20,0.88);
            }
            #timeline-topline { margin-bottom: 0; }
            #timeline-heading, #timeline-all { font-size: 0.5rem; }
            #timeline-range-label { font-size: 0.54rem; }
            #timeline-control { height: 16px; margin: 0 5px; }
            #timeline-track,
            #timeline-selection { top: 6px; }
            .timeline-range { height: 16px; }
            .timeline-range::-webkit-slider-runnable-track { height: 16px; }
            .timeline-range::-moz-range-track { height: 16px; }
            .timeline-range::-webkit-slider-thumb { margin-top: 1px; }
            #timeline-years { margin-top: -2px; font-size: 0.46rem; }
        }

        #adventure-modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #adventure-modal-bg.open {
            display: flex;
        }

        #adventure-modal {
            background: transparent;
            border-radius: 0;
            overflow: visible;
            width: fit-content;
            max-width: calc(100vw - 40px);
            max-height: 90vh;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 24px;
            box-shadow: none;
            animation: modalIn 0.28s ease;
            scroll-behavior: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        #adventure-modal::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        #modal-carousel {
            width: fit-content;
            max-width: min(65vw, 900px);
            max-height: 90vh;
            position: relative;
            background: #000;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 16px;
        }

        #carousel-track {
            display: grid;
            max-height: 90vh;
        }

        .carousel-slide {
            grid-area: 1 / 1;
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .carousel-slide.active {
            position: relative;
            max-width: min(65vw, 900px);
            opacity: 1;
            pointer-events: auto;
        }

        .carousel-slide img {
            width: auto;
            height: auto;
            max-width: min(65vw, 900px);
            max-height: 88vh;
            display: block;
        }

        .modal-badge {
            position: absolute;
            bottom: 16px;
            left: 18px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .modal-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6347;
            flex-shrink: 0;
        }

        .photo-date {
            position: absolute;
            bottom: 16px;
            right: 18px;
            color: rgba(255,255,255,1);
            font-size: 0.875rem;
            z-index: 10;
            font-style: italic;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: background 0.2s;
            padding: 0;
        }

        .carousel-btn:hover { background: rgba(255,99,71,0.8); }
        #carousel-prev { left: 10px; }
        #carousel-next { right: 10px; }

        #carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .carousel-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: background 0.2s;
        }

        .carousel-dot.active { background: #fff; }

        #modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
            padding: 0;
        }

        #modal-close:hover { background: rgba(255, 99, 71, 0.85); }

        #photo-counter {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 0.75rem;
            border-radius: 20px;
            padding: 4px 10px;
            z-index: 3;
            display: none;
        }

        #modal-body {
            position: relative;
            align-self: center;
            width: min(410px, 34vw);
            max-height: 82vh;
            overflow-y: auto;
            padding: 28px 26px;
            border: 1px solid rgba(245,240,232,0.12);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(17,17,17,0.96);
            box-shadow: 0 24px 80px rgba(0,0,0,0.55);
        }

        #modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6347;
            line-height: 1.3;
        }

        #modal-desc {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #bbb;
            font-style: italic;
            margin: 0;
        }

        @media (max-width: 700px) {
            .top-bar { 
                padding: 18px 20px; 
                gap: 12px;
            }
            .monogram { font-size: 18px; white-space: nowrap; flex-shrink: 0; }
            nav.main-nav a { 
                padding: 8px 8px; 
                font-size: 11px; 
                letter-spacing: 0.08em;
            }
            .overlay-panel {
                top: 80px;          /* ← just below the nav bar */
                left: 20px;
                right: 20px;
                max-width: none;
            }
            .hero-title {
                font-size: clamp(34px, 12vw, 64px);
            }

            html, body { cursor: auto; }
            .cursor, .cursor-ring { display: none; }
        }

        @media (max-width: 600px) {
            #adventure-modal {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                max-height: calc(100dvh - 24px);
                overflow-y: auto;
            }
            #modal-carousel,
            .carousel-slide.active,
            .carousel-slide img {
                width: auto;
                max-width: calc(100vw - 32px);
                max-height: 52vh;
            }
            #modal-body {
                width: min(100%, 520px);
                max-height: 34vh;
                padding: 18px 20px;
            }
        }
    </style>
</head>

                description: "The Tetons. Doesn't really need that Grand of an introduction (hahaha). The crew woke up at the crack of dawn and booked it down from our campsite in Yellowstone. Having absolutely no idea where we were going to be sleeping that night, we started the trek of 'Lake Solitude'. Started off behind a horse crew and got my favorite picture of the trip. The crews hiking chemistry was at an all time high, jokes were flowing, and parents were loving us! For every sports team merchandise we saw on the trial, we pretended to be fans. The people loved us. By far our longest hike of the trip, we were lucky enough to witness a moose AND some black bears off in the distance. Harpoon unfortunately was unable to give them a bear hug #niceshirt. We reached the lake and took it all in. Played some hacky with an incredible backdrop. Jumped in the water to cool off. We did some epic canon balls. Did our silly dances and headed back down. Harpoon snipped a campground at the last second. We shared some drinks and stories with our German neighbor we met. By golly did he have some tales. Watched the sunset at over the Tetons and hit the hay. What a day."

                    { src: "Images/Mount_Pilchuck_4.jpg", date: "May 31, 2026" }
                ],
                description: "After an eventful first Ryder Cup trip and a week of Molina staying with me in Bellingham, it was time for the fun to come to an end. We spent the night at Harpoon's in Seattle to make the early morning airport drive a little easier. After dropping Molina off at SeaTac, I headed straight for Mount Pilchuck. I had been keeping an eye on the snow levels for a while, and with the recent stretch of sunny weather, most of the snow had melted. It seemed like the perfect opportunity to make the SeaTac trip worthwhile. I waited for Costco to open its gas station at 6:00 AM sharp, grabbed a coffee, fueled up, and hit the road. I started the trail around 7:00 AM and was back down by 10:30 AM. The hike featured plenty of rock scrambling and rewarded me with incredible views in every direction. The most notable peaks were Mt. Rainier (not pictured), Mt. Baker, and Glacier Peak. Both summits of Three Fingers stood out prominently on the horizon. What an amazing day to be atop Mount Pilchuck with such clear skies and panoramic mountain views!"

                description: "Stayed home sick the entire weekend. I was dying to get outside and was feeling better Sunday morning, so I decided to drive up Mt. Baker Highway to hike the Aster Butte Trail. I intentionally brought a snot rag with me since I was still battling a sinus infection. I was also very underprepared. Still not having a rain jacket, I started the hike in the cold, wet rain. Luckily, it was sustainable until I got to the top of the Butte. I ended up bailing on whatever the final ascent is, as it was 2x as cold and windy up there. Hiked back down the mountain with my hands in my pockets. Thugged it out in the end, but lessons learned: come more prepared. Still need that rain jacket."

            {
                title: "Cheakamus(Check)Canyon",

                description: "Peter and I caught a little rain on our inaugural night in Squamish. In an attempt to find some cover, we headed into the forest up the road to a sport climbing crag called Chek Canyon. The weather warmed up quickly and, to our surprise, the rock was dry! I spent the day following easy sport routes with Peter until, before I knew it, I was attempting a 5.11a. After climbing the rope more than the actual wall, I eventually made it to the top. Found my limit at least. I then belayed Peter as he attempted to flash a slippery 5.12a. It did not go in his favor, but he eventually conquered the slippery beast. I remember the rock here being very geometric. It was as if Minecraft Steve had built a cobblestone staircase into the side of the wall. Oh almost forgot about Kinto Ramen on the way up. They loved the fact that we both finished our bowls, so they decided to take a promotional image of us for the page. Very funny props they had!"

        adventures.forEach(a => {
            if (!a.photos || a.photos.length === 0) {
                a.photos = [{ src: a.image || '', date: '' }];
            }
            if (!a.category) a.category = 'general';
            const photoDate = a.photos.map(photo => Date.parse(photo.date || '')).find(Number.isFinite);
            a.timelineDate = Number.isFinite(photoDate) ? Math.floor(photoDate / 86400000) : null;
        });

let activeFilter = 'all';
        const adventureDates = adventures.map(adventure => adventure.timelineDate).filter(Number.isFinite);
        const timelineMinDate = Math.min(...adventureDates);
        const timelineMaxDate = Math.max(...adventureDates);
        let timelineStart = timelineMinDate;
        let timelineEnd = timelineMaxDate;
        const timelineStartInput = document.getElementById('timeline-start');
        const timelineEndInput = document.getElementById('timeline-end');
        const timelineSelection = document.getElementById('timeline-selection');
        const timelineRangeLabel = document.getElementById('timeline-range-label');
        const timelineControl = document.getElementById('timeline-control');

        function formatTimelineDate(day, options = { month: 'short', year: 'numeric', timeZone: 'UTC' }) {
            return new Date(day * 86400000).toLocaleDateString('en-US', options);
        }

        function syncTimeline() {
            const day = 1;
            timelineStartInput.min = timelineMinDate;
            timelineStartInput.max = timelineEnd;
            timelineStartInput.step = day;
            timelineStartInput.value = timelineStart;
            timelineEndInput.min = timelineStart;
            timelineEndInput.max = timelineMaxDate;
            timelineEndInput.step = day;
            timelineEndInput.value = timelineEnd;

            timelineRangeLabel.textContent = timelineStart === timelineMinDate && timelineEnd === timelineMaxDate
                ? 'All years'
                : `${formatTimelineDate(timelineStart, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' })} – ${formatTimelineDate(timelineEnd, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' })}`;
            document.getElementById('timeline-min-date').textContent = formatTimelineDate(timelineMinDate);
            document.getElementById('timeline-max-date').textContent = formatTimelineDate(timelineMaxDate);

            const range = Math.max(1, timelineMaxDate - timelineMinDate);
            const left = (timelineStart - timelineMinDate) / range * 100;
            const width = (timelineEnd - timelineStart) / range * 100;
            timelineSelection.style.left = `${left}%`;
            timelineSelection.style.width = `${Math.max(width, 2)}%`;
            applyAdventureFilters();
        }

        function setTimelineRange(start, end) {
            timelineStart = Math.max(timelineMinDate, Math.min(start, timelineMaxDate));
            timelineEnd = Math.max(timelineStart, Math.min(end, timelineMaxDate));
            syncTimeline();
        }

        function applyAdventureFilters() {
            viewer.entities.values.forEach(entity => {
                if (!entity.properties) return;
                const category = entity.properties.category.getValue();
                const date = entity.properties.timelineDate.getValue();
                const dateMatches = timelineStart === timelineMinDate && timelineEnd === timelineMaxDate
                    || date !== null && date >= timelineStart && date <= timelineEnd;
                entity.show = (activeFilter === 'all' || category === activeFilter) && dateMatches;
            });
        }

        timelineStartInput.addEventListener('input', () => {
            const start = Number(timelineStartInput.value);
            setTimelineRange(start, Math.max(start, timelineEnd));
        });
        timelineEndInput.addEventListener('input', () => {
            const end = Number(timelineEndInput.value);
            setTimelineRange(Math.min(timelineStart, end), end);
        });
        document.getElementById('timeline-all').addEventListener('click', () => {
            setTimelineRange(timelineMinDate, timelineMaxDate);
        });

        let dragTimeline = null;
        timelineSelection.addEventListener('pointerdown', event => {
            event.preventDefault();
            dragTimeline = { x: event.clientX, start: timelineStart, end: timelineEnd };
            timelineSelection.setPointerCapture(event.pointerId);
        });
        timelineSelection.addEventListener('pointermove', event => {
            if (!dragTimeline) return;
            const rect = timelineControl.getBoundingClientRect();
            const delta = Math.round((event.clientX - dragTimeline.x) / rect.width * (timelineMaxDate - timelineMinDate));
            const width = dragTimeline.end - dragTimeline.start;
            const start = Math.max(timelineMinDate, Math.min(dragTimeline.start + delta, timelineMaxDate - width));
            setTimelineRange(start, start + width);
        });
        const stopTimelineDrag = () => { dragTimeline = null; };
        timelineSelection.addEventListener('pointerup', stopTimelineDrag);
        timelineSelection.addEventListener('pointercancel', stopTimelineDrag);
        syncTimeline();

        function setFilter(filter) {
            activeFilter = filter;
            document.getElementById('btn-all').classList.toggle('active', filter === 'all');
            document.getElementById('btn-golf').classList.toggle('active', filter === 'golf');
            document.getElementById('btn-climbing').classList.toggle('active', filter === 'climbing');

            applyAdventureFilters();
        }

        function makePhotoPinCanvas(imgSrc, accentColor, onReady) {
            const S = 80;
            const R = 28;
            const CX = S / 2;
            const CY = R + 4;
            const TIP_H = 10;

            function draw(photoImg) {
                const canvas = document.createElement('canvas');
                canvas.width = S;
                canvas.height = CY + R + TIP_H + 4;
                const ctx = canvas.getContext('2d');
                const totalH = canvas.height;

                ctx.beginPath();
                ctx.arc(CX + 1, CY + 2, R + 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(CX, CY, R + 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(CX - 9, CY + R + 2);
                ctx.lineTo(CX + 9, CY + R + 2);
                ctx.lineTo(CX, totalH - 2);
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.arc(CX, CY, R, 0, Math.PI * 2);
                ctx.clip();

                if (photoImg) {
                    ctx.drawImage(photoImg, CX - R, CY - R, R * 2, R * 2);
                } else {
                    ctx.fillStyle = accentColor;
                    ctx.fillRect(CX - R, CY - R, R * 2, R * 2);
                }

                ctx.restore();
                onReady(canvas);
            }

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => draw(img);
            img.onerror = () => draw(null);
            img.src = imgSrc;
        }

        let pinQueue = [...adventures];

        function processNextPin() {
            if (pinQueue.length === 0) return;
            const place = pinQueue.shift();
            const isInternational = !place.badge.includes('USA') && !place.badge.includes('KY') && !place.badge.includes('WA');
            const pinColor = place.category === 'golf' ? '#3a7d44'
                : isInternational ? '#f59e0b'
                : '#ff6347';
            const thumbSrc = place.photos[0].src;

            makePhotoPinCanvas(thumbSrc, pinColor, canvas => {
                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(place.lon, place.lat, 0),
                    billboard: {
                        image: canvas,
                        width: canvas.width,
                        height: canvas.height,
                        heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, 0),
                        disableDepthTestDistance: Number.POSITIVE_INFINITY,
                        scaleByDistance: new Cesium.NearFarScalar(1.5e6, 1.0, 2.5e7, 0.4),
                    },
                    name: place.title,
                    properties: new Cesium.PropertyBag({
                        badge: place.badge,
                        photos: JSON.stringify(place.photos),
                        description: place.description,
                        category: place.category,
                        timelineDate: place.timelineDate
                    })
                });
                const categoryMatches = activeFilter === 'all' || place.category === activeFilter;
                const dateMatches = timelineStart === timelineMinDate && timelineEnd === timelineMaxDate
                    || place.timelineDate !== null
                    && place.timelineDate >= timelineStart
                    && place.timelineDate <= timelineEnd;
                viewer.entities.values[viewer.entities.values.length - 1].show = categoryMatches && dateMatches;
            });
            setTimeout(processNextPin, 0);
        }

        setTimeout(processNextPin, 800);

        let carouselPhotos = [];
        let carouselIndex = 0;

        const modalBg = document.getElementById('adventure-modal-bg');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalClose = document.getElementById('modal-close');
        const carousel = document.getElementById('modal-carousel');
        const track = document.getElementById('carousel-track');
        const dotsWrap = document.getElementById('carousel-dots');
        const prevBtn = document.getElementById('carousel-prev');
        const nextBtn = document.getElementById('carousel-next');
        const counter = document.getElementById('photo-counter');

        function buildCarousel(photos) {
            carouselPhotos = photos;
            carouselIndex = 0;

            track.innerHTML = '';
            dotsWrap.innerHTML = '';

            photos.forEach((p, i) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');

                const img = document.createElement('img');
                // Only eagerly load first 2 slides, lazy-load the rest
                img.src = p.src;  // not conditional, we want the browser to handle caching and loading
                img.dataset.src = p.src;  // ← add this
                img.alt = '';
                // ... rest of your existing buildCarousel loop unchanged

                slide.appendChild(img);

                if (p.date) {
                    const dateEl = document.createElement('span');
                    dateEl.className = 'photo-date';
                    dateEl.textContent = p.date;
                    slide.appendChild(dateEl);
                }

                track.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goTo(i));
                dotsWrap.appendChild(dot);
            });

            const multi = photos.length > 1;
            prevBtn.style.display = multi ? 'flex' : 'none';
            nextBtn.style.display = multi ? 'flex' : 'none';
            dotsWrap.style.display = multi ? 'flex' : 'none';
            counter.style.display = multi ? 'block' : 'none';

            updateCarousel();
        }

        function updateCarousel() {
            track.querySelectorAll('.carousel-slide')
                .forEach((s, i) => s.classList.toggle('active', i === carouselIndex));
            dotsWrap.querySelectorAll('.carousel-dot')
                .forEach((d, i) => d.classList.toggle('active', i === carouselIndex));
            counter.textContent = `${carouselIndex + 1} / ${carouselPhotos.length}`;
        }

        function goTo(idx) {
            carouselIndex = (idx + carouselPhotos.length) % carouselPhotos.length;
            // Preload next slide
            const next = (carouselIndex + 1) % carouselPhotos.length;
            const slides = track.querySelectorAll('.carousel-slide img');
            if (slides[next] && !slides[next].src) {
                slides[next].src = slides[next].dataset.src;
            }
            updateCarousel();
        }

        prevBtn.addEventListener('click', () => goTo(carouselIndex - 1));
        nextBtn.addEventListener('click', () => goTo(carouselIndex + 1));

        let touchStartX = 0;
        track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        track.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 40) goTo(carouselIndex + (dx < 0 ? 1 : -1));
        });

        function openModal(entity) {
            const props = entity.properties;
            modalTitle.textContent = entity.name;
            modalDesc.textContent = props.description.getValue();
            modalBadge.textContent = props.badge.getValue();

            modalBg.classList.add('open');
            document.body.style.overflow = 'hidden';

            const photos = JSON.parse(props.photos.getValue());
            buildCarousel(photos);

            const modal = document.getElementById('adventure-modal');
            const firstImg = track.querySelector('img');
            const scrollTop = () => { modal.scrollTop = 0; };

            if (firstImg && !firstImg.complete) {
                firstImg.addEventListener('load', scrollTop, { once: true });
            } else {
                scrollTop();
            }
        }

        function closeModal() {
            modalBg.classList.remove('open');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModal(); return; }
            if (!modalBg.classList.contains('open')) return;
            if (e.key === 'ArrowLeft') goTo(carouselIndex - 1);
            if (e.key === 'ArrowRight') goTo(carouselIndex + 1);
        });

        viewer.screenSpaceEventHandler.setInputAction(function (click) {
            const picked = viewer.scene.pick(click.position);
            if (Cesium.defined(picked) && Cesium.defined(picked.id) && picked.id.properties) {
                openModal(picked.id);
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(-98.5, 39.8, 20000000)
        });

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '20px';
                cursor.style.height = '20px';
                ring.style.width = '60px';
                ring.style.height = '60px';
                ring.style.borderColor = 'var(--rust)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '12px';
                cursor.style.height = '12px';
                ring.style.width = '40px';
                ring.style.height = '40px';
                ring.style.borderColor = '';
            });
        });
    </script>
